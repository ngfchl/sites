url = ["https://piggo.me/", ]
name = "猪猪网"
nickname = "piggo"
logo = "favicon.ico"
tracker = "tracker.piggo.me"
sp_full = 130
limit_speed = 100
tags = "儿童,动画片,影视"
iyuu = 69
# 站点已提供官方实验室 API（/v1/api，独立域名 api.piggo.me，Bearer 存取令牌鉴权，勿用前台登录态或 HMAC）
# 存取令牌：个人中心新建，32 位小写十六进制，明文等同账号密码，存 authkey 字段；搜索/信息/下载均走实验室 API
# 签到：实验室 API 无签到端点，走前台万年历接口（POST /v1/web/calendar/attendance），
#       需在浏览器登录后把前台 pig_token 更新到 local_storage 字段
sign_in = true
sign_type = "PIGGO_SIGN"
get_info = true
repeat_torrents = true
# 实验室 API 种子条目无促销/HR 字段，无法识别优惠，刷流免费识别关闭（促销请以前台为准）
brush_free = false
brush_rss = true
hr_discern = false
search_torrents = true
# 实验室 API 根路径（搜索/信息/下载），缺省由镜像域名推导 api.piggo.me/v1/api
lab_api_base = "https://api.piggo.me/v1/api"
# 前台 API 前缀 /v1/web（仅签到）：Bearer <local_storage 的 pig_token> + X-Spa-Hmac 签名
page_index = "torrents"
page_torrents = "v1/api/torrents"
page_detail = "detail/{}"
page_download = "v1/api/torrents/{}/download-link"
page_user = "v1/api/me"
page_search = ["torrents?q={}", ]
page_message = "mails"
page_leeching = ""
page_uploaded = ""
page_seeding = ""
page_completed = ""
imdb_search = "torrents?q={}"
# 用户信息字段布局（/me 返回 data.user.{...stats}）：猪猪网映射硬编码该布局，以下规则仅作文档参考
my_invitation_rule = "user/stats/invites"
my_time_join_rule = "user/created_at"
my_latest_active_rule = "user/last_access"
my_uploaded_rule = "user/stats/uploaded"
my_downloaded_rule = "user/stats/downloaded"
my_ratio_rule = "user/stats/ratio"
my_bonus_rule = "user/stats/bonus"
my_per_hour_bonus_rule = "user/stats/seedbonus_per_hour"
my_score_rule = "user/stats/seed_points"
my_level_rule = "user/class/name"
my_uid_rule = "user/id"
my_leech_rule = "user/stats/leeching"
my_seed_rule = "user/stats/seeding"
my_email_rule = "user/email"
my_username_rule = "user/username"
hr = false
alive = true
proxy = true

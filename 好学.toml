# 站点已迁移新框架（Next.js 前后分离）：前台 www.hxpt.top，后端 API 同域 /api/v1（会话认证）
# 认证：浏览器登录后把 flux.* cookie（flux_csrf/flux_token/flux.session）更新到 cookie 字段，
#       适配器自动取 flux_token 作为 Bearer JWT
# 旧域名 www.hxpt.org 已失效（TLS 握手被重置）
url = ["https://www.hxpt.top/", ]
name = "好学"
nickname = "好学"
logo = "favicon.ico"
tracker = "tracker.hxpt.org|tracker.hxpt.top|www.hxpt.top|www.hxpt.org"
sp_full = 300
limit_speed = 25
tags = "儿童,学习资料"
iyuu = 137
sign_in = true
sign_type = "HXPT_SIGN"
get_info = true
repeat_torrents = true
brush_free = true
brush_rss = true
hr_discern = false
search_torrents = true
page_index = ""
page_torrents = "torrents"
page_sign_in = ""
page_control_panel = ""
page_detail = "detail/{}"
page_download = "api/v1/torrents/{}/download-link"
page_user = "api/v1/me"
page_search = ["api/v1/torrents?search={}", ]
page_message = ""
page_hr = ""
page_leeching = ""
page_uploaded = ""
page_seeding = ""
page_completed = ""
page_mybonus = ""
page_viewfilelist = ""
# 新 UI 为 Next.js 客户端渲染（前后分离），HTML XPath 不适用；
# 数据经 /api/v1 JSON API 获取（见 page_*_api 与 internal/service/ptspider/hxpt.go），字段布局见探测样例：
#   /me:       {id, username, class_name, class_id, uploaded(字节), downloaded(字节), seeding, leeching, unread_messages}
#   /torrents: data.items[]{id, name, small_descr, poster, size(字节), seeders, leechers, comments, created_at(ISO), category_id, promotion, promotion_ends_at, tags[{name}], hr_policy, imdb_id, info_hash, pieces_hash}
#   下载:      POST /api/v1/torrents/{id}/download-link → data.download_url（约 24 小时短链，普通 GET 拉取）
alive = true
pieces_repeat = false
proxy = true
imdb_search = "api/v1/torrents?imdb_id={}"
structure = "NexusPHP"
type = "pt"
nation = "china"
my_email_rule = "//td[contains(text(),'邮箱')]/following-sibling::td[1]//text()"
my_username_rule = "//table[@id='info_block']//span/a[contains(@class,'_Name') and contains(@href,'userdetails.php?id=')]/b/text()"
buy_page = "mybonus.php?action=exchange"

